name: CI

# Blocks merge to main on test failure.
# Runs on every PR and on direct pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Backend — pytest with moto (no real AWS needed)
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest + moto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          # Stub all env vars that modules import at load time
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          DYNAMODB_ASSESSMENT_TABLE: test_oral_assessments
          DYNAMODB_TABLE_NAME: test_chat_sessions
          DYNAMODB_AUTH_USERS_TABLE: test_auth_users
          AUTH_JWT_SECRET: ci-test-secret-32-chars-minimum-xx
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: test
          NEO4J_DATABASE: neo4j
          DEEPGRAM_SECRET_KEY: test
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: |
          PYTHONPATH=. pytest tests/ -q \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=68

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: htmlcov/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 2: Instructor frontend — type-check + lint + Vitest
  # ─────────────────────────────────────────────────────────
  instructor-frontend-test:
    name: Instructor Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oral-assessment-instructor/package-lock.json

      - name: Install dependencies
        working-directory: oral-assessment-instructor
        run: npm ci

      - name: Type check
        working-directory: oral-assessment-instructor
        run: npm run type-check

      - name: Lint
        working-directory: oral-assessment-instructor
        run: npm run lint

      - name: Run Vitest
        working-directory: oral-assessment-instructor
        run: npm run test:run

  # ─────────────────────────────────────────────────────────
  # Job 3: Student frontend — type-check + lint + Vitest
  # ─────────────────────────────────────────────────────────
  student-frontend-test:
    name: Student Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oral-assessment-student/package-lock.json

      - name: Install dependencies
        working-directory: oral-assessment-student
        run: npm ci

      - name: Type check
        working-directory: oral-assessment-student
        run: npm run type-check

      - name: Lint
        working-directory: oral-assessment-student
        run: npm run lint

      - name: Run Vitest
        working-directory: oral-assessment-student
        run: npm run test:run

  # ─────────────────────────────────────────────────────────
  # Job 4: AI Tutor frontend — `npm run validate`
  # (type-check + lint + format:check + Vitest — the same command
  # CLAUDE.md tells contributors to run, so CI and local agree)
  # ─────────────────────────────────────────────────────────
  ai-tutor-frontend-test:
    name: AI Tutor Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-tutor-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ai-tutor-frontend
        run: npm ci

      - name: Validate
        working-directory: ai-tutor-frontend
        run: npm run validate

  # ─────────────────────────────────────────────────────────
  # Job 5: Playwright E2E — full local integration test
  # Runs against mocked API (no real AWS) using page.route()
  # ─────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # E2E is the slowest job — run after unit tests pass to save runner minutes
    needs: [backend-test, instructor-frontend-test, student-frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd oral-assessment-student && npm ci
          cd ../oral-assessment-instructor && npm ci

      - name: Run Playwright tests (mocked API, servers auto-started)
        working-directory: e2e
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          DYNAMODB_ASSESSMENT_TABLE: test_oral_assessments
          DYNAMODB_TABLE_NAME: test_chat_sessions
          DYNAMODB_AUTH_USERS_TABLE: test_auth_users
          AUTH_JWT_SECRET: ci-test-secret-32-chars-minimum-xx
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: test
          NEO4J_DATABASE: neo4j
          DEEPGRAM_SECRET_KEY: test
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 6: API types drift — shared/types/api.ts is generated
  # from the backend's OpenAPI schema and committed. Regenerate
  # it here and fail if it differs, so a backend DTO change that
  # silently breaks a frontend surfaces at PR time.
  # ─────────────────────────────────────────────────────────
  api-types-drift:
    name: API Types Drift (shared/types/api.ts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Regenerate API types
        run: ./shared/generate-api-types.sh

      - name: Fail if the committed types are stale
        run: |
          if git diff --quiet -- shared/types/api.ts; then
            echo "shared/types/api.ts matches the backend's OpenAPI schema."
            exit 0
          fi
          echo "::error file=shared/types/api.ts::shared/types/api.ts is out of date with the backend's OpenAPI schema."
          cat <<'MSG'

          A backend DTO or route changed but the generated frontend types were not
          regenerated, so the TypeScript the frontends compile against no longer
          matches what the API sends.

          Fix it locally, from the repo root:

              pip install -r requirements.txt
              ./shared/generate-api-types.sh
              git add shared/types/api.ts

          Then commit and push. If you changed no DTOs, a backend dependency bump
          changed the schema — regenerate and commit it anyway.

          --- what changed ---
          MSG
          git --no-pager diff -- shared/types/api.ts
          exit 1
