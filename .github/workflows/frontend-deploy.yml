name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ai-tutor-frontend/**"
      - ".github/workflows/frontend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tutor-frontend

    # OIDC: request id-token permission to get a short-lived AWS credential
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure frontend env
        run: |
          if [ -z "${{ vars.FRONTEND_API_BASE_URL }}" ]; then
            echo "FRONTEND_API_BASE_URL is required"
            exit 1
          fi

          if [[ "${{ vars.FRONTEND_API_BASE_URL }}" != https://* ]]; then
            echo "FRONTEND_API_BASE_URL must start with https://"
            exit 1
          fi

          echo "VITE_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL }}" > .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "VITE_ANALYTICS_ENABLED=${{ vars.VITE_ANALYTICS_ENABLED }}" >> .env.production

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Assets: long-lived cache (Vite outputs content-hashed filenames)
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # index.html: never cache — CloudFront invalidation handles propagation
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache (fast paths)
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(join(',', Origins.Items[].DomainName), '${{ vars.S3_BUCKET }}')].Id | [0]" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "Unable to resolve CloudFront distribution for S3 bucket: ${{ vars.S3_BUCKET }}"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/" "/index.html"
